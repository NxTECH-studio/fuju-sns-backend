openapi: 3.0.3
info:
  title: FUJU Backend API
  version: 0.1.0
  description: |
    FUJU SNS backend. Authenticated via AuthCore-issued Bearer JWT; the
    backend validates each request with RFC 7662 introspection (cached
    30s in-process). See `docs/authcore-integration.md` for the token
    lifecycle.

    The path space intentionally mixes bare (`/posts`, `/timeline/...`)
    and `/v1`-prefixed (`/v1/images`, `/v1/admin/...`) routes. This
    matches the current router in `cmd/server/main.go` and is kept
    faithful here; unification is tracked as future work.
  contact:
    name: FUJU Team
  license:
    name: MIT

servers:
  - url: http://localhost:8080
    description: Development
  # TBD: production base URL not yet fixed. Left as a placeholder so
  # generated SDKs fall back to the dev server unless overridden.
  - url: https://api.fuju.example.com
    description: Production (TBD)

# Public reads coexist with authenticated operations. Security is opted
# into per-operation rather than globally so that e.g. `GET /users` stays
# unauthenticated.
security: []

tags:
  - name: Health
    description: Liveness / readiness probes
  - name: Me
    description: The authenticated caller's own identity
  - name: Users
    description: User profile lookup and update
  - name: Posts
    description: Posts, replies, and likes
  - name: Follows
    description: Follow relations and follower / following lists
  - name: Timelines
    description: Home, user, and global timelines
  - name: Images
    description: Image upload and deletion (requires R2 configuration)
  - name: Badges (Admin)
    description: Admin-only badge master and grant management

paths:
  /health:
    get:
      tags: [Health]
      operationId: healthCheck
      summary: Health check
      description: Liveness probe. Always returns 200 when the server is up.
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /me:
    get:
      tags: [Me]
      operationId: meGet
      summary: Get authenticated user's own profile
      description: |
        Returns the caller's own user record, including the `is_admin`
        flag. The user row is lazily created / hydrated from AuthCore on
        first access.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Authenticated user's self view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SelfUserEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /users:
    get:
      tags: [Users]
      operationId: usersListUsers
      summary: List users
      description: Paginated list of users. Public read.
      security: []
      parameters:
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/OffsetParam"
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /users/{sub}:
    parameters:
      - $ref: "#/components/parameters/SubPathParam"
    get:
      tags: [Users]
      operationId: usersGetUser
      summary: Get a user by sub
      description: Public user profile lookup. Returns the public view (no `is_admin`).
      security: []
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicUserEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      tags: [Users]
      operationId: usersUpdateUser
      summary: Update own profile
      description: |
        Only the authenticated user may modify their own `bio` and
        `banner_url`. AuthCore-owned fields (`display_name`,
        `display_id`, `icon_url`) and `is_admin` are not mutable via
        this endpoint.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserProfileRequest"
      responses:
        "200":
          description: Updated self view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SelfUserEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /posts:
    get:
      tags: [Posts]
      operationId: postsListPosts
      summary: List posts
      description: |
        Cursor-paginated list of posts. Optional `user_id` query scopes
        results to a single author. Viewer sub is inferred from the
        Authorization header when present and drives the
        `liked_by_viewer` / `following_author` flags.
      security: []
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/PostLimitParam"
        - in: query
          name: user_id
          schema:
            $ref: "#/components/schemas/ULID"
          required: false
          description: When set, restricts the feed to posts authored by this user.
      responses:
        "200":
          description: Post list page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [Posts]
      operationId: postsCreatePost
      summary: Create a post (or reply)
      description: |
        Creates a post. Setting `parent_post_id` to an existing post ID
        turns the new record into a reply. OGP previews are enqueued
        asynchronously — expect `ogp_previews` to be empty initially and
        populated on subsequent reads.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePostRequest"
      responses:
        "201":
          description: Post created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostDetailEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          description: Request body exceeds the 16 KiB limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /posts/{id}:
    parameters:
      - $ref: "#/components/parameters/PostIDPathParam"
    get:
      tags: [Posts]
      operationId: postsGetPost
      summary: Get a post by ID
      description: |
        Public read. Viewer sub is optional; when supplied via Bearer
        token it drives the `liked_by_viewer` / `following_author`
        flags.
      security: []
      responses:
        "200":
          description: Post detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostDetailEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [Posts]
      operationId: postsDeletePost
      summary: Delete a post
      description: Only the author may delete their post.
      security:
        - BearerAuth: []
      responses:
        "204":
          description: Post deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /posts/{id}/replies:
    parameters:
      - $ref: "#/components/parameters/PostIDPathParam"
    get:
      tags: [Posts]
      operationId: postsListReplies
      summary: List replies to a post
      description: Cursor-paginated replies. Same shape as `/posts`.
      security: []
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/PostLimitParam"
      responses:
        "200":
          description: Reply list page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /posts/{id}/like:
    parameters:
      - $ref: "#/components/parameters/PostIDPathParam"
    post:
      tags: [Posts]
      operationId: postsLikePost
      summary: Like a post
      description: Idempotent — liking an already-liked post is a no-op.
      security:
        - BearerAuth: []
      responses:
        "204":
          description: Liked (or already liked)
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [Posts]
      operationId: postsUnlikePost
      summary: Unlike a post
      description: Idempotent — unliking a non-liked post is a no-op.
      security:
        - BearerAuth: []
      responses:
        "204":
          description: Unliked (or was not liked)
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/images:
    get:
      tags: [Images]
      operationId: imagesListMine
      summary: List the authenticated user's uploaded images
      description: |
        Returns the caller's uploaded images. Requires R2 storage to be
        configured on the server; when R2 is not configured the route
        is not registered and returns 404.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Image list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: R2 storage not configured; route unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [Images]
      operationId: imagesUpload
      summary: Upload an image
      description: |
        Multipart upload. The `file` field is required and must be an
        `image/*` MIME type; both the advertised `Content-Type` and a
        server-side sniff of the first bytes must agree. Max file size
        is 5 MiB. Requires R2 storage to be configured.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Image payload (image/* only, max 5 MiB).
      responses:
        "201":
          description: Uploaded image metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: R2 storage not configured; route unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/images/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          $ref: "#/components/schemas/ULID"
        description: Image ID (ULID).
    delete:
      tags: [Images]
      operationId: imagesDelete
      summary: Delete an uploaded image
      description: |
        Only the image owner may delete. R2 delete is best-effort — the
        DB row is soft-deleted even if the object-storage call fails.
      security:
        - BearerAuth: []
      responses:
        "204":
          description: Image deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /users/{sub}/follow:
    parameters:
      - $ref: "#/components/parameters/SubPathParam"
    post:
      tags: [Follows]
      operationId: followsFollow
      summary: Follow a user
      description: |
        Idempotent. Returns the refreshed `followers_count` so the UI
        can update without a second roundtrip. Self-follow is rejected
        with 400.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Follow result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowResultEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [Follows]
      operationId: followsUnfollow
      summary: Unfollow a user
      description: Idempotent — unfollowing a user you do not follow is a no-op.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Unfollow result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowResultEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /users/{sub}/followers:
    parameters:
      - $ref: "#/components/parameters/SubPathParam"
    get:
      tags: [Follows]
      operationId: followsListFollowers
      summary: List a user's followers
      description: |
        Cursor is an opaque token returned by a prior page (internally
        `base64url(RFC3339Nano + "|" + follower_sub)` — do not parse).
      security: []
      parameters:
        - $ref: "#/components/parameters/OpaqueCursorParam"
        - $ref: "#/components/parameters/FollowLimitParam"
      responses:
        "200":
          description: Follower list page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /users/{sub}/following:
    parameters:
      - $ref: "#/components/parameters/SubPathParam"
    get:
      tags: [Follows]
      operationId: followsListFollowing
      summary: List users a given user is following
      description: Cursor semantics match `/users/{sub}/followers`.
      security: []
      parameters:
        - $ref: "#/components/parameters/OpaqueCursorParam"
        - $ref: "#/components/parameters/FollowLimitParam"
      responses:
        "200":
          description: Following list page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /timeline/home:
    get:
      tags: [Timelines]
      operationId: timelinesHome
      summary: Home timeline
      description: |
        Authenticated home timeline of the caller and the authors they
        follow. Cursor-paginated (ULID cursor).
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/PostLimitParam"
      responses:
        "200":
          description: Home timeline page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /timeline/user/{sub}:
    parameters:
      - $ref: "#/components/parameters/SubPathParam"
    get:
      tags: [Timelines]
      operationId: timelinesUser
      summary: A user's public timeline
      description: |
        Public read. Viewer sub is inferred from the Bearer token when
        present and populates `liked_by_viewer` / `following_author`.
      security: []
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/PostLimitParam"
      responses:
        "200":
          description: User timeline page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /timeline/global:
    get:
      tags: [Timelines]
      operationId: timelinesGlobal
      summary: Global timeline
      description: Firehose of all public posts, newest first.
      security: []
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/PostLimitParam"
      responses:
        "200":
          description: Global timeline page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostListResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/admin/badges:
    get:
      tags: [Badges (Admin)]
      operationId: adminBadgesList
      summary: List all badges (master)
      description: Admin only. Returns every badge in the master list.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Badge master list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadgeListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [Badges (Admin)]
      operationId: adminBadgesCreate
      summary: Create a new badge
      description: Admin only.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBadgeRequest"
      responses:
        "201":
          description: Badge created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadgeEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/admin/badges/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          $ref: "#/components/schemas/ULID"
        description: Badge ID (ULID).
    put:
      tags: [Badges (Admin)]
      operationId: adminBadgesUpdate
      summary: Update a badge
      description: |
        Admin only. `key` is immutable — only label / description /
        icon_url / color / priority are writable.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBadgeRequest"
      responses:
        "200":
          description: Badge updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadgeEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/admin/users/{sub}/badges:
    parameters:
      - $ref: "#/components/parameters/SubPathParam"
    post:
      tags: [Badges (Admin)]
      operationId: adminBadgesGrant
      summary: Grant a badge to a user
      description: Admin only. The target user is identified by AuthCore sub.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrantBadgeRequest"
      responses:
        "201":
          description: Badge granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrantBadgeEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/admin/users/{sub}/badges/{badge_id}:
    parameters:
      - $ref: "#/components/parameters/SubPathParam"
      - in: path
        name: badge_id
        required: true
        schema:
          $ref: "#/components/schemas/ULID"
        description: Badge ID (ULID) to revoke.
    delete:
      tags: [Badges (Admin)]
      operationId: adminBadgesRevoke
      summary: Revoke a badge from a user
      description: Admin only. Idempotent.
      security:
        - BearerAuth: []
      responses:
        "204":
          description: Badge revoked (or was not granted)
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        AuthCore-issued access token. Validated per request via RFC 7662
        introspection (30s in-process cache).

  parameters:
    SubPathParam:
      in: path
      name: sub
      required: true
      schema:
        $ref: "#/components/schemas/ULID"
      description: AuthCore sub (ULID, 26 chars).
    PostIDPathParam:
      in: path
      name: id
      required: true
      schema:
        $ref: "#/components/schemas/ULID"
      description: Post ID (ULID).
    LimitParam:
      in: query
      name: limit
      required: false
      schema:
        type: integer
        default: 20
        minimum: 1
      description: |
        Page size. Values <= 0 are silently ignored; the server applies
        its default (20).
    OffsetParam:
      in: query
      name: offset
      required: false
      schema:
        type: integer
        default: 0
        minimum: 0
      description: Zero-based offset into the list.
    PostLimitParam:
      in: query
      name: limit
      required: false
      schema:
        type: integer
      description: |
        Page size for cursor-paginated post/reply/timeline endpoints.
        Unparseable or zero values fall back to the usecase default.
    FollowLimitParam:
      in: query
      name: limit
      required: false
      schema:
        type: integer
      description: |
        Page size for follower / following lists. Unparseable or zero
        values fall back to the usecase default.
    CursorParam:
      in: query
      name: cursor
      required: false
      schema:
        $ref: "#/components/schemas/ULID"
      description: |
        Cursor returned by a prior page. For post-like endpoints the
        cursor is a ULID; unparseable values are silently treated as
        "start from the top".
    OpaqueCursorParam:
      in: query
      name: cursor
      required: false
      schema:
        type: string
      description: |
        Opaque cursor token returned by a prior page. Clients must pass
        it back verbatim; the format is internal and may change.

  schemas:
    ULID:
      type: string
      description: Crockford Base32 ULID (26 chars).
      pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
      minLength: 26
      maxLength: 26
      example: "01HZXYABCDEFGHJKMNPQRSTVWX"

    Timestamp:
      type: string
      format: date-time
      description: RFC 3339 timestamp.

    Error:
      type: object
      required: [code, message, timestamp]
      properties:
        code:
          type: string
          description: Stable machine-readable error code.
          example: INVALID_REQUEST
        message:
          type: string
          description: Human-readable error message.
        timestamp:
          $ref: "#/components/schemas/Timestamp"

    HealthResponse:
      type: object
      required: [status, timestamp]
      properties:
        status:
          type: string
          example: ok
        timestamp:
          type: string
          description: RFC 3339 timestamp of when the check ran.
          example: "2026-04-21T12:34:56Z"

    Badge:
      type: object
      description: Badge master record.
      required: [id, key, label, icon_url, color, priority]
      properties:
        id:
          $ref: "#/components/schemas/ULID"
        key:
          type: string
          description: Machine-readable unique key.
          maxLength: 64
        label:
          type: string
          description: Display name.
          maxLength: 64
        description:
          type: string
          description: Optional free-text description. Omitted when empty.
        icon_url:
          type: string
        color:
          type: string
          description: 'UI color hint (e.g. "blue", "gold").'
          maxLength: 16
        priority:
          type: integer
          format: int32
          minimum: 0

    PublicUser:
      type: object
      description: |
        Publicly visible user profile. Returned by `/users` and
        `/users/{sub}`. `deleted_at` is omitted for active users.
      required:
        - sub
        - display_name
        - display_id
        - icon_url
        - bio
        - banner_url
        - badges
        - created_at
        - updated_at
        - profile_refreshed_at
      properties:
        sub:
          $ref: "#/components/schemas/ULID"
        display_name:
          type: string
          description: |
            Cached AuthCore display name (1h TTL, refreshed on next
            access when stale).
        display_id:
          type: string
          description: Cached AuthCore @handle.
        icon_url:
          type: string
          description: Cached AuthCore avatar URL.
        bio:
          type: string
          maxLength: 500
        banner_url:
          type: string
          maxLength: 1024
        badges:
          type: array
          items:
            $ref: "#/components/schemas/Badge"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
        deleted_at:
          type: string
          format: date-time
          nullable: true
        profile_refreshed_at:
          $ref: "#/components/schemas/Timestamp"

    SelfUser:
      description: |
        Authenticated caller's own view. Extends `PublicUser` with
        `is_admin`.
      allOf:
        - $ref: "#/components/schemas/PublicUser"
        - type: object
          required: [is_admin]
          properties:
            is_admin:
              type: boolean

    UpdateUserProfileRequest:
      type: object
      description: |
        Partial profile update. Omit a field to leave it unchanged. Pass
        an empty string to clear.
      additionalProperties: false
      properties:
        bio:
          type: string
          maxLength: 500
          nullable: true
        banner_url:
          type: string
          maxLength: 1024
          nullable: true

    PostImage:
      type: object
      required: [id, public_url, position]
      properties:
        id:
          $ref: "#/components/schemas/ULID"
        public_url:
          type: string
        position:
          type: integer
          description: 0-based display order within the post (capped at 3).
          minimum: 0
          maximum: 3

    PostTag:
      type: object
      required: [id, name]
      properties:
        id:
          $ref: "#/components/schemas/ULID"
        name:
          type: string
          maxLength: 64

    PostAuthor:
      type: object
      description: |
        Minimal author card embedded in a Post response. Field names
        end with `_cached` to reflect that they mirror AuthCore
        profile data with a 1h TTL.
      required: [sub, display_name_cached, display_id_cached, icon_url_cached]
      properties:
        sub:
          $ref: "#/components/schemas/ULID"
        display_name_cached:
          type: string
        display_id_cached:
          type: string
        icon_url_cached:
          type: string

    PostOGPPreview:
      type: object
      description: |
        OGP card attached to a post. Only cached rows with an `ok`
        fetch status are emitted; pending / error rows are hidden from
        this response.
      required: [url, title, description, image_url, site_name, canonical_url]
      properties:
        url:
          type: string
        title:
          type: string
        description:
          type: string
        image_url:
          type: string
        site_name:
          type: string
        canonical_url:
          type: string

    Post:
      type: object
      description: |
        Post detail as returned by the post / timeline / reply endpoints
        after hydration. Field shape comes from
        `internal/usecase/post/hydrate.go` combined with the handler's
        response view.
      required:
        - id
        - user_id
        - content
        - parent_post_id
        - root_post_id
        - likes_count
        - replies_count
        - visibility
        - created_at
        - updated_at
        - images
        - tags
        - author
        - ogp_previews
        - liked_by_viewer
        - following_author
      properties:
        id:
          $ref: "#/components/schemas/ULID"
        user_id:
          $ref: "#/components/schemas/ULID"
        content:
          type: string
          maxLength: 120
        parent_post_id:
          type: string
          pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
          minLength: 26
          maxLength: 26
          nullable: true
          description: Non-null for replies (ULID of the parent post).
        root_post_id:
          type: string
          pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
          minLength: 26
          maxLength: 26
          nullable: true
          description: Root of the reply thread (self for top-level posts, ULID).
        likes_count:
          type: integer
          format: int64
          minimum: 0
        replies_count:
          type: integer
          format: int64
          minimum: 0
        visibility:
          type: string
          description: |
            Visibility scope. Currently always `public`; reserved for
            future friends-only / unlisted modes.
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
        images:
          type: array
          items:
            $ref: "#/components/schemas/PostImage"
          maxItems: 4
        tags:
          type: array
          items:
            $ref: "#/components/schemas/PostTag"
          maxItems: 10
        author:
          type: object
          description: |
            Minimal author card. May be null when the author record has
            been deleted after the post was created. Field names end
            with `_cached` to reflect that they are AuthCore-sourced
            with a 1h TTL.
          nullable: true
          allOf:
            - $ref: "#/components/schemas/PostAuthor"
        ogp_previews:
          type: array
          items:
            $ref: "#/components/schemas/PostOGPPreview"
        liked_by_viewer:
          type: boolean
          description: True when the Bearer caller has liked this post.
        following_author:
          type: boolean
          description: True when the Bearer caller follows the author.

    CreatePostRequest:
      type: object
      required: [content]
      additionalProperties: false
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 120
        image_ids:
          type: array
          description: ULIDs of images previously uploaded by the caller.
          items:
            $ref: "#/components/schemas/ULID"
          maxItems: 4
          uniqueItems: true
        parent_post_id:
          type: string
          pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
          minLength: 26
          maxLength: 26
          nullable: true
          description: Set to turn the new record into a reply (ULID).

    Image:
      type: object
      description: |
        Uploaded image metadata. `public_url` is the URL the client
        should embed.
      required:
        - id
        - file_name
        - mime_type
        - file_size
        - public_url
        - user_id
        - created_at
        - updated_at
      properties:
        id:
          $ref: "#/components/schemas/ULID"
        file_name:
          type: string
        mime_type:
          type: string
        file_size:
          type: integer
          format: int64
          minimum: 0
        public_url:
          type: string
        user_id:
          $ref: "#/components/schemas/ULID"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
        deleted_at:
          type: string
          format: date-time
          nullable: true

    CreateBadgeRequest:
      type: object
      required: [key, label, color, priority]
      additionalProperties: false
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 64
        label:
          type: string
          minLength: 1
          maxLength: 64
        description:
          type: string
        icon_url:
          type: string
          maxLength: 1024
        color:
          type: string
          maxLength: 16
        priority:
          type: integer
          format: int32
          minimum: 0

    UpdateBadgeRequest:
      type: object
      description: |
        Partial update. `key` is not mutable through this endpoint.
      additionalProperties: false
      properties:
        label:
          type: string
          maxLength: 64
        description:
          type: string
        icon_url:
          type: string
          maxLength: 1024
        color:
          type: string
          maxLength: 16
        priority:
          type: integer
          format: int32
          minimum: 0

    GrantBadgeRequest:
      type: object
      required: [badge_key]
      additionalProperties: false
      properties:
        badge_key:
          type: string
          minLength: 1
          maxLength: 64
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: |
            Optional. If set, the grant is hidden on reads after this
            time.
        reason:
          type: string
          maxLength: 255

    FollowResult:
      type: object
      required: [following, followers_count]
      properties:
        following:
          type: boolean
          description: True if the caller currently follows the target.
        followers_count:
          type: integer
          format: int64
          minimum: 0

    # ---- Envelopes (wrap payloads in `{ data: ... }`) ----

    PublicUserEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/PublicUser"

    SelfUserEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/SelfUser"

    PostDetailEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Post"

    ImageEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Image"

    BadgeEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Badge"

    BadgeListEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Badge"

    GrantBadgeEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [status, user_id, badge]
          properties:
            status:
              type: string
              enum: [granted]
            user_id:
              $ref: "#/components/schemas/ULID"
            badge:
              $ref: "#/components/schemas/Badge"

    FollowResultEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/FollowResult"

    # ---- List responses (offset + cursor) ----

    UserListResponse:
      type: object
      description: Offset-paginated list of users.
      required: [data, limit, offset, total]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/PublicUser"
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer

    ImageListResponse:
      type: object
      description: |
        List of the caller's uploaded images. The server always returns
        the full set (`limit=100`, `offset=0`, `total` = count).
      required: [data, limit, offset, total]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Image"
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer

    PostListResponse:
      type: object
      description: Cursor-paginated list of posts.
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Post"
        next_cursor:
          type: string
          nullable: true
          description: |
            Opaque cursor for the next page. `null` when there are no
            more results.

    FollowListResponse:
      type: object
      description: Cursor-paginated list of users (follower / following).
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/PublicUser"
        next_cursor:
          type: string
          nullable: true

  responses:
    BadRequest:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid Bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authenticated but not permitted.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Target resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: State conflict (duplicate key, etc).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnprocessableEntity:
      description: Semantic validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: Upstream dependency unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
