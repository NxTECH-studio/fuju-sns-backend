version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fuju-backend
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SERVER_PORT: 8080
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-fuju}
      DB_USER: ${DB_USER:-fuju_user}
      DB_PASSWORD: ${DB_PASSWORD:-fuju_password}
      DB_MAX_CONN: ${DB_MAX_CONN:-25}
      DB_MIN_CONN: ${DB_MIN_CONN:-5}
      REDIS_URL: redis://redis:6379
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET}
      OAUTH_REDIRECT_URL: ${OAUTH_REDIRECT_URL:-http://localhost:8080/auth/oauth/callback}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-1800}
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_DURATION: ${SESSION_DURATION:-86400}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_PUBLIC_DOMAIN: ${R2_PUBLIC_DOMAIN}
      R2_MAX_FILE_SIZE: ${R2_MAX_FILE_SIZE:-5242880}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fuju-network
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: fuju-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-fuju_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fuju_password}
      POSTGRES_DB: ${DB_NAME:-fuju}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-fuju_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fuju-network

  redis:
    image: redis:7-alpine
    container_name: fuju-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fuju-network

  adminer:
    image: adminer:latest
    container_name: fuju-adminer
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fuju-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  fuju-network:
    driver: bridge
