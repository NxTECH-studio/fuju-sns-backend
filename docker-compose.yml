version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fuju-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-fuju_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fuju_password}
      POSTGRES_DB: ${DB_NAME:-fuju}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-fuju_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fuju-network

  redis:
    image: redis:7-alpine
    container_name: fuju-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fuju-network

  adminer:
    image: adminer:latest
    container_name: fuju-adminer
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fuju-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  fuju-network:
    driver: bridge
