name: CI/CD Pipeline

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]

permissions:
    contents: read
    pull-requests: write
    issues: write

env:
    # Keep in sync with the `go` directive in go.mod.
    GO_VERSION: "1.25"
    GOLANGCI_LINT_VERSION: "v2.11.4"

jobs:
    setup:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v4
              with:
                  go-version: ${{ env.GO_VERSION }}
                  cache: true

    lint:
        runs-on: ubuntu-latest
        needs: setup
        steps:
            - uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v4
              with:
                  go-version: ${{ env.GO_VERSION }}
                  cache: true

            - name: Run golangci-lint
              run: |
                  curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin ${{ env.GOLANGCI_LINT_VERSION }}
                  golangci-lint run --timeout=5m

            - name: Run go fmt
              run: |
                  if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
                    echo "Go files are not formatted:"
                    gofmt -s -d .
                    exit 1
                  fi

            - name: Run go vet
              run: go vet ./...

    test:
        runs-on: ubuntu-latest
        needs: lint
        services:
            postgres:
                image: postgres:15-alpine
                env:
                    POSTGRES_DB: fuju_test
                    POSTGRES_USER: fuju
                    POSTGRES_PASSWORD: testpass
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
                ports:
                    - 5432:5432

        steps:
            - uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v4
              with:
                  go-version: ${{ env.GO_VERSION }}
                  cache: true

            - name: Download dependencies
              run: go mod download

            - name: Run unit tests
              run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
              env:
                  DB_HOST: localhost
                  DB_PORT: 5432
                  DB_NAME: fuju_test
                  DB_USER: fuju
                  DB_PASSWORD: testpass

            - name: Apply database migrations
              run: |
                  for m in db/migrations/*.sql; do
                    echo "Applying $(basename "$m")"
                    PGPASSWORD=testpass psql -h localhost -U fuju -d fuju_test -v ON_ERROR_STOP=1 -f "$m"
                  done

            - name: Run integration tests (postgres)
              run: go test -tags=integration -race ./internal/repository/postgres/...
              env:
                  DATABASE_URL: postgres://fuju:testpass@localhost:5432/fuju_test?sslmode=disable
                  REPO_BACKEND: postgres

            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@v3
              with:
                  file: ./coverage.out
                  flags: unittests
                  name: codecov-umbrella
                  fail_ci_if_error: false

            - name: Generate coverage badge
              run: |
                  go install github.com/AlexBeauchemin/gobadge@latest
                  coverage=$(go tool cover -func coverage.out | grep total | awk '{print int($3)}')
                  echo "Coverage: ${coverage}%"

    build:
        runs-on: ubuntu-latest
        needs: test
        strategy:
            matrix:
                os: [linux, darwin, windows]
                arch: [amd64, arm64]
                exclude:
                    - os: windows
                      arch: arm64
        steps:
            - uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v4
              with:
                  go-version: ${{ env.GO_VERSION }}
                  cache: true

            - name: Build binary
              run: |
                  mkdir -p bin
                  GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} go build \
                    -ldflags="-X main.Version=${{ github.sha }}" \
                    -o bin/fuju-backend-${{ matrix.os }}-${{ matrix.arch }} \
                    ./cmd/server
              env:
                  CGO_ENABLED: 0

            - name: Upload build artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: fuju-backend-${{ matrix.os }}-${{ matrix.arch }}
                  path: bin/fuju-backend-${{ matrix.os }}-${{ matrix.arch }}
                  retention-days: 7

    security:
        runs-on: ubuntu-latest
        needs: setup
        steps:
            - uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v4
              with:
                  go-version: ${{ env.GO_VERSION }}
                  cache: true

            - name: Run security checks with gosec
              uses: securego/gosec@master
              with:
                  args: -no-fail -fmt json -out gosec-results.json ./...
              continue-on-error: true

            - name: Check for vulnerable dependencies
              run: |
                  go install github.com/golang/vuln/cmd/govulncheck@latest
                  govulncheck ./...
              continue-on-error: true

    deploy-staging:
        runs-on: ubuntu-latest
        needs: [lint, test, build, security]
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        steps:
            - uses: actions/checkout@v4

            - name: Deploy to staging
              run: |
                  echo "Deploying to staging environment..."
                  # Add your staging deployment script here
                  # Example: kubectl apply -f k8s/staging/

            - name: Health check
              run: |
                  echo "Running health checks..."
                  # Add health check script here

    notify:
        runs-on: ubuntu-latest
        needs: [lint, test, build]
        if: always()
        steps:
            - name: Determine CI status
              id: ci-status
              run: |
                  if [ "${{ needs.lint.result }}" = "failure" ] || \
                     [ "${{ needs.test.result }}" = "failure" ] || \
                     [ "${{ needs.build.result }}" = "failure" ]; then
                    echo "status=failed" >> $GITHUB_OUTPUT
                  else
                    echo "status=success" >> $GITHUB_OUTPUT
                  fi

            - name: Comment on PR
              if: github.event_name == 'pull_request'
              uses: actions/github-script@v7
              with:
                  script: |
                      const status = '${{ steps.ci-status.outputs.status }}';
                      const emoji = status === 'success' ? '✅' : '❌';
                      const comment = `${emoji} CI/CD Pipeline ${status}`;

                      github.rest.issues.createComment({
                        issue_number: context.issue.number,
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        body: comment
                      });
